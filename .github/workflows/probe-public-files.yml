name: Probe public picture download

# One-off experiment on the probe-public-files branch: can the fridge's
# View Inside pictures be fetched through the public SmartThings API?
on:
  push:
    branches: [probe-public-files]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_public_files_2.py
        env:
          ST_TOKEN: ${{ secrets.SAMSUNG || secrets.SMARTTHINGS_TOKEN }}
